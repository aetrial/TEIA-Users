# =============================================================================
# TEIA-users Local Development Profile
# =============================================================================
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Or set SPRING_PROFILES_ACTIVE=local environment variable
#
# This profile enables running TEIA-users locally without:
# - External PostgreSQL database (uses H2 in-memory)
# - Real Twilio traffic (signature validation disabled)
# - Production secrets (uses local dev defaults)

# =============================================================================
# H2 In-Memory Database
# =============================================================================
# MODE=PostgreSQL for compatibility with existing queries
spring.datasource.url=jdbc:h2:mem:teiadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Enable H2 Console for debugging
# Access at: http://localhost:8099/teiaUsers/h2-console
# JDBC URL: jdbc:h2:mem:teiadb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =============================================================================
# Twilio Signature Validation - DISABLED for local testing
# =============================================================================
# Allows testing webhook endpoints without real Twilio signatures
teia.twilio.signature-validation.enabled=false

# =============================================================================
# TEIA Core URLs - Localhost
# =============================================================================
# HTTP endpoint for API calls
teia.core.base-url=http://localhost:8000

# WebSocket endpoint for Twilio Media Streams (use ws:// for local, wss:// for prod)
teia.core.ws-base-url=ws://localhost:8000

# =============================================================================
# Local Development Secrets
# =============================================================================
# WARNING: These are NOT secure and must NEVER be used in production.
# They match the defaults in TEIA Core's .env.example for seamless local dev.

# JWT signing key (min 32 chars)
jwt.secret=teia-local-dev-jwt-secret-change-in-prod-abc123

# AES-256-GCM encryption key for credentials at rest (base64, 32 bytes)
# This is a test key - generate a new one for production
encryption.key=K7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols=

# Shared secret for HMAC authentication between TEIA-users and TEIA Core
# Must match INTERNAL_SECRET in TEIA Core's .env
internal.secret=teia-local-dev-secret-change-in-prod
teia.core.internal-secret=teia-local-dev-secret-change-in-prod

# =============================================================================
# Session Token Configuration
# =============================================================================
# Longer validity for easier testing (5 minutes instead of 60 seconds)
teia.session-token.validity-seconds=300

# =============================================================================
# Credit Configuration - Lower values for testing
# =============================================================================
teia.credits.call-reservation=1.00
teia.credits.message-reservation=0.10
teia.credits.per-minute=0.50

# =============================================================================
# Disable Background Tasks
# =============================================================================
# Disable scheduled token cleanup during local development
refresh-token.cleanup.cron=-

# Disable encryption migration (not needed for fresh H2 database)
encryption.migration.enabled=false

# =============================================================================
# Logging - More verbose for debugging
# =============================================================================
logging.level.com.teia.users=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# =============================================================================
# Stripe Configuration - Local Development
# =============================================================================
# For local testing, use Stripe CLI to forward webhooks:
#   stripe listen --forward-to localhost:8099/teiaUsers/billing/webhook
#
# The CLI will provide a webhook signing secret (whsec_...) to use below.
# You can use a test mode API key from Stripe Dashboard or leave as placeholder.

# Test mode API key (sk_test_...) - get from https://dashboard.stripe.com/test/apikeys
stripe.secret-key=sk_test_PLACEHOLDER_replace_with_your_test_key

# Webhook secret from Stripe CLI (stripe listen prints this)
stripe.webhook-secret=whsec_PLACEHOLDER_from_stripe_cli
