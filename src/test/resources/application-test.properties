# Test configuration - use H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Swagger for tests
springfox.documentation.enabled=false

# JWT Configuration for tests
jwt.secret=test-secret-key-for-jwt-authentication-must-be-at-least-32-chars
jwt.access-expiry-ms=900000
jwt.refresh-expiry-ms=604800000

# Disable scheduled tasks during tests
refresh-token.cleanup.cron=-

# Encryption Configuration for tests
# This is a valid 32-byte (256-bit) base64-encoded key for testing only
# Generated with: openssl rand -base64 32
encryption.key=ywapTHQDhw9YdzwAD+3m0gPOa3Hl/M3cUN5e3upf6OA=
encryption.migration.enabled=false
