spring.application.name=teia-teiaUsers
server.servlet.context-path=/teiaUsers
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/teiacore
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driverClassName=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# SpringDoc OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# JWT Configuration
# REQUIRED: JWT_SECRET must be set via environment variable (min 32 characters / 256 bits for HS256)
# The application will fail to start if JWT_SECRET is not set or is too short.
jwt.secret=${JWT_SECRET}
jwt.access-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
jwt.refresh-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# Refresh Token Cleanup Scheduler
# Runs daily at 2:00 AM by default. Customize via REFRESH_TOKEN_CLEANUP_CRON env var.
refresh-token.cleanup.cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 2 * * *}

# =============================================================================
# TEIA Core Client Configuration
# =============================================================================
# These settings configure outbound requests to the TEIA Core service.
# All requests are automatically signed with HMAC authentication via TeiaCoreSigningInterceptor.

# Shared secret for HMAC signing. MUST match TEIA Core's INTERNAL_SECRET.
# For local development, the default value works out of the box with TEIA Core's .env.example.
# In production, set INTERNAL_SECRET env var to a strong, unique secret.
teia.core.internal-secret=${INTERNAL_SECRET:teia-local-dev-secret-change-in-prod}

# Shared secret for validating inbound signed requests from TEIA Core.
# Must match TEIA Core's INTERNAL_SECRET.
internal.secret=${INTERNAL_SECRET:teia-local-dev-secret-change-in-prod}

# Base URL of the TEIA Core service
teia.core.base-url=${TEIA_CORE_BASE_URL:http://localhost:8000}

# Client ID to include in X-Client-ID header.
# This identifies which TeiaUser is making the request.
# In actual service calls, pass the user's ID (Long) to TeiaCoreClient methods.
# This property is informational; the client ID is set per-request.

# Connection and read timeouts in milliseconds
teia.core.connect-timeout-ms=${TEIA_CORE_CONNECT_TIMEOUT_MS:5000}
teia.core.read-timeout-ms=${TEIA_CORE_READ_TIMEOUT_MS:30000}

# =============================================================================
# Encryption Configuration
# =============================================================================
# AES-256-GCM encryption for sensitive credentials stored at rest.
# REQUIRED: ENCRYPTION_KEY must be set via environment variable.
# The key must be a base64-encoded 32-byte (256-bit) value.
# Generate a key with: openssl rand -base64 32
# Example: K7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols=
encryption.key=${ENCRYPTION_KEY}

# Encryption Migration
# Set to true to migrate existing plaintext credentials to encrypted format.
# Run once, then set back to false.
encryption.migration.enabled=${ENCRYPTION_MIGRATION_ENABLED:false}

# =============================================================================
# TEIA Core WebSocket Configuration
# =============================================================================
# WebSocket URL for TEIA Core (used in TwiML for Twilio Media Streams)
teia.core.ws-base-url=${TEIA_CORE_WS_BASE_URL:wss://localhost:8000}

# =============================================================================
# Session Token Configuration
# =============================================================================
# Validity period for session tokens (seconds). Twilio must connect within this window.
teia.session-token.validity-seconds=${SESSION_TOKEN_VALIDITY_SECONDS:60}

# =============================================================================
# Credit Configuration
# =============================================================================
# Credits reserved for a call session (will be reconciled after session ends)
teia.credits.call-reservation=${CREDITS_CALL_RESERVATION:5.00}

# Credits reserved for a message session
teia.credits.message-reservation=${CREDITS_MESSAGE_RESERVATION:1.00}

# Credits charged per minute of call (used for reconciliation)
teia.credits.per-minute=${CREDITS_PER_MINUTE:1.00}

# =============================================================================
# Twilio Signature Validation
# =============================================================================
# Enable/disable X-Twilio-Signature validation on /twilio/inbound/** endpoints.
# Disable for local testing without real Twilio traffic.
teia.twilio.signature-validation.enabled=${TWILIO_SIGNATURE_VALIDATION_ENABLED:true}

# =============================================================================
# Stripe Configuration
# =============================================================================
# REQUIRED: Set these via environment variables in production.
# STRIPE_SECRET_KEY: Your Stripe secret API key (sk_live_... or sk_test_...)
# STRIPE_WEBHOOK_SECRET: Webhook signing secret from Stripe Dashboard (whsec_...)
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/billing/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/billing/cancel}